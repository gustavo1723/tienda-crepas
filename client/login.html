<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Tienda de Crepas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            color: #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #BA7900;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #FFAA00;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-container button:hover {
            background: #ffcc44;
        }
        .error-msg {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        .volver {
            text-align: center;
            margin-top: 20px;
        }
        .volver a {
            color: #BA7900;
        }
    </style>
</head>
<body style="background: url('fondoladrillos.jpg') repeat; min-height: 100vh;">
    <div class="login-container">
        <h2>🔐 Acceso Proveedor</h2>
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuario" required autocomplete="off">
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <div id="errorMsg" class="error-msg"></div>
        <div class="volver">
            <a href="index.html">← Volver a la tienda</a>
        </div>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(API + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ usuario, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = 'proveedor.html';
                } else {
                    document.getElementById('errorMsg').textContent = data.error || 'Error de acceso';
                }
            } catch (error) {
                document.getElementById('errorMsg').textContent = 'Error de conexión con el servidor';
            }
        });
    </script>
</body>
</html>
